[project]
name = "genpwd-sh"
version = "0.1.0"
description = "Password and passphrase generator with a web UI and a curl-friendly API"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "flask>=3.0.0",
    "flask-limiter>=4.1.1",
    "gunicorn>=23.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-flask>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
