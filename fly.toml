# fly.toml app configuration file generated for genpwdsh on 2025-07-13T21:08:59+04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#


app = 'genpwdsh'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 9876
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
  force_https = false

[[services]]
  internal_port = 9876
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
